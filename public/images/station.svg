<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1523" />
      <stop offset="100%" stop-color="#070B16" />
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12E6F2" />
      <stop offset="100%" stop-color="#9A5CFF" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#spaceBg)" />
  <!-- Grid lines -->
  <path d="M 0,200 L 600,200 M 300,0 L 300,400" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <circle cx="300" cy="200" r="120" fill="none" stroke="rgba(18,230,242,0.1)" stroke-width="2" />
  <circle cx="300" cy="200" r="180" fill="none" stroke="rgba(154,92,255,0.05)" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Outer Satellite Relay Solar Panels structure -->
  <g transform="translate(300,200)">
    <!-- Rotating crossbars -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#485A8A" stroke-width="4" />
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#485A8A" stroke-width="3" />
    
    <!-- Left Panel array -->
    <rect x="-170" y="-20" width="50" height="40" fill="#1C233A" stroke="#12E6F2" stroke-width="1.5" rx="3" />
    <line x1="-145" y1="-20" x2="-145" y2="20" stroke="#12E6F2" stroke-width="1" />
    
    <!-- Right Panel array -->
    <rect x="120" y="-20" width="50" height="40" fill="#1C233A" stroke="#12E6F2" stroke-width="1.5" rx="3" />
    <line x1="145" y1="-20" x2="145" y2="20" stroke="#12E6F2" stroke-width="1" />
    
    <!-- Station Central Biosphere dome -->
    <circle cx="0" cy="0" r="45" fill="#0A0F1D" stroke="#9A5CFF" stroke-width="3" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#12E6F2" stroke-width="2" filter="url(#glow)" opacity="0.6"/>
    
    <!-- Glowing core signals -->
    <circle cx="0" cy="0" r="12" fill="url(#neonGlow)" filter="url(#glow)" />
    <!-- HUD Rings and labels -->
    <path d="M -30,-30 L -50,-50 L -90,-50" fill="none" stroke="#12E6F2" stroke-width="1" />
    <text x="-95" y="-55" fill="#12E6F2" font-family="monospace" font-size="9" letter-spacing="1">RELAY: IRIS-V9</text>
  </g>
</svg>
