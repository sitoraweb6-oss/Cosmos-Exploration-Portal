<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1523" />
      <stop offset="100%" stop-color="#070B16" />
    </radialGradient>
    <linearGradient id="warpRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12E6F2" />
      <stop offset="50%" stop-color="#9A5CFF" />
      <stop offset="100%" stop-color="#12E6F2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#spaceBg)" />

  <g transform="translate(300, 200)">
    <!-- Casimir Warp Bubble ring - Back portion -->
    <ellipse cx="0" cy="0" rx="90" ry="140" fill="none" stroke="url(#warpRing)" stroke-width="6" opacity="0.4" filter="url(#glow)" />
    
    <!-- Ship Chassis -->
    <!-- Engines rear -->
    <rect x="-140" y="-15" width="40" height="30" fill="#1C233A" stroke="#9A5CFF" stroke-width="1.5" rx="2" />
    <polygon points="-100,-25 -30,-15 -30,15 -100,25" fill="#0F1523" stroke="#485A8A" stroke-width="2" />
    <!-- Ship Main body spearhead pointing forward (right) -->
    <polygon points="-30,-15 110,0 -30,15" fill="#151D35" stroke="#12E6F2" stroke-width="2.5" />
    
    <!-- Casimir Warp Bubble ring - Front portion overlay -->
    <path d="M 0,-140 A 90,140 0 0 1 0,140" fill="none" stroke="#12E6F2" stroke-width="5" filter="url(#glow)" />
    
    <!-- Thrust Trail glow -->
    <polygon points="-140,-5 -220,0 -140,5" fill="rgba(18,230,242,0.3)" filter="url(#glow)" />
  </g>
  
  <text x="30" y="40" fill="#12E6F2" font-family="monospace" font-size="8" letter-spacing="2">MODEL // FTL-ALCUBIERRE XIV</text>
</svg>
