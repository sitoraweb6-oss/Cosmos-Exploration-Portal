<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141D35" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#avatarBg)" rx="20" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(18,230,242,0.15)" stroke-width="1.5" />
  
  <g transform="translate(100, 80)">
    <!-- Helmet / Suit Silhouette -->
    <path d="M 10,240 C 20,150 180,150 190,240 Z" fill="#1C233A" stroke="#485A8A" stroke-width="2" />
    <!-- Helmet Dome Outer -->
    <circle cx="100" cy="110" r="75" fill="#0F1523" stroke="#9A5CFF" stroke-width="3" />
    
    <!-- Visor Area with cyan light bounce -->
    <path d="M 40,110 Q 100,60 160,110 Q 100,165 40,110 Z" fill="#050505" stroke="#12E6F2" stroke-width="2" />
    
    <!-- Decrypted telemetry digital bars on visor -->
    <line x1="60" y1="100" x2="80" y2="100" stroke="#12E6F2" stroke-width="2.5" filter="url(#glow)" />
    <line x1="65" y1="110" x2="105" y2="110" stroke="#12E6F2" stroke-width="1.5" />
    <circle cx="130" cy="105" r="3" fill="#9A5CFF" filter="url(#glow)" />
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#A3A9B7" font-family="monospace" font-size="10" letter-spacing="2">DR. Vance // COMPILER</text>
</svg>
