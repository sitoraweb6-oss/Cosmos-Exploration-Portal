<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1523" />
      <stop offset="100%" stop-color="#070B16" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#spaceBg)" />

  <g transform="translate(300, 200)">
    <!-- Main rectangular robust cargo design of the signal carrier -->
    <rect x="-160" y="-35" width="280" height="70" fill="#111625" stroke="#485A8A" stroke-width="2.5" rx="5" />
    <line x1="-160" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Ribbed details along the container -->
    <line x1="-100" y1="-35" x2="-100" y2="35" stroke="#9A5CFF" stroke-width="1.5" />
    <line x1="-40" y1="-35" x2="-40" y2="35" stroke="#12E6F2" stroke-width="1.5" />
    <line x1="20" y1="-35" x2="20" y2="35" stroke="#9A5CFF" stroke-width="1.5" />
    <line x1="80" y1="-35" x2="80" y2="35" stroke="#12E6F2" stroke-width="1.5" />
    
    <!-- Forward cockpit radar node dome -->
    <path d="M 120,-20 A 20,20 0 0 1 120,20 Z" fill="#1C233A" stroke="#12E6F2" stroke-width="2" />
    <circle cx="127" cy="0" r="4" fill="#12E6F2" filter="url(#glow)" />
    
    <!-- Antennas array -->
    <line x1="120" y1="-15" x2="150" y2="-45" stroke="#12E6F2" stroke-width="1.5" />
    <circle cx="150" cy="-45" r="3" fill="#12E6F2" />
    
    <!-- Signal waves radiating from antenna -->
    <circle cx="150" cy="-45" r="10" fill="none" stroke="#12E6F2" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />
    <circle cx="150" cy="-45" r="18" fill="none" stroke="#12E6F2" stroke-width="1" stroke-dasharray="4,4" opacity="0.3" />
  </g>
  
  <text x="30" y="380" fill="#A3A9B7" font-family="monospace" font-size="8" letter-spacing="2">AUTONOMOUS QUANTUM FREIGHTER_9</text>
</svg>
