<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1523" />
      <stop offset="100%" stop-color="#070B16" />
    </radialGradient>
    <radialGradient id="blackhole" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="60%" stop-color="#000000" />
      <stop offset="85%" stop-color="#12E6F2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9A5CFF" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#spaceBg)" />

  <g transform="translate(300,200)">
    <!-- Rotating Ellipses simulating tilted disk -->
    <ellipse cx="0" cy="0" rx="200" ry="45" fill="none" stroke="#9A5CFF" stroke-width="2" opacity="0.3" transform="rotate(-15)" />
    <ellipse cx="0" cy="0" rx="170" ry="32" fill="none" stroke="#12E6F2" stroke-width="3" opacity="0.6" filter="url(#glow)" transform="rotate(-15)" />
    <ellipse cx="0" cy="0" rx="140" ry="20" fill="none" stroke="#12E6F2" stroke-width="1.5" transform="rotate(-15)" />
    
    <!-- Central Void -->
    <circle cx="0" cy="0" r="40" fill="#000000" />
    <circle cx="0" cy="0" r="46" fill="url(#blackhole)" filter="url(#glow)" />
    
    <!-- Dynamic high energy emission vectors -->
    <line x1="0" y1="-40" x2="0" y2="-180" stroke="#12E6F2" stroke-width="2.5" opacity="0.8" filter="url(#glow)" />
    <line x1="0" y1="40" x2="0" y2="180" stroke="#9A5CFF" stroke-width="2" opacity="0.6" filter="url(#glow)" />
  </g>
  
  <text x="500" y="380" fill="#9A5CFF" font-family="monospace" font-size="8" letter-spacing="1">VELA_CORE // LOCK</text>
</svg>
